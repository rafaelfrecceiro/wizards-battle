<!doctype html><html lang="pt-BR"><meta charset="utf-8"><title>Transferência local de decks</title><script>
// Ponte de leitura exclusiva 4180 → 4181, acionada pelo usuário no novo gerenciador.
addEventListener('message',event=>{
  if(location.origin!=='http://127.0.0.1:4180'||event.origin!=='http://127.0.0.1:4181'||event.source!==parent||event.data?.type!=='wb-read-decks'||typeof event.data.nonce!=='string')return;
  let raw=null;try{raw=localStorage.getItem('wb-decks-v1')}catch{}
  parent.postMessage({type:'wb-decks-v04',nonce:event.data.nonce,raw},event.origin);
});
</script><p>Transferência local somente de listas de decks. Partidas e sessões permanecem na versão anterior.</p></html>
